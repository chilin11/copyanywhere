# 构建并运行：./install-docker.sh（会生成 .env），或 docker compose up -d --build
# HTTPS 由 cloudflared 提供，两种接法任选：
#   1. VPS 上已装 cloudflared：Public Hostname 指向 http://127.0.0.1:8090
#   2. 在 .env 填 TUNNEL_TOKEN，install-docker.sh 会一并启动下面的 cloudflared 容器，
#      Public Hostname 指向 http://copyanywhere:8080
services:
  copyanywhere:
    build: .
    image: copyanywhere:local
    container_name: copyanywhere
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /data
    ports:
      - "${BIND_HOST:-127.0.0.1}:${HOST_PORT:-8090}:8080"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: copyanywhere-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - copyanywhere
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:

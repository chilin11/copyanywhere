<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CopyAnywhere">
  <title>CopyAnywhere</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="bar">
    <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>CopyAnywhere</span></div>
    <div class="bar-actions" id="barActions" hidden>
      <span class="pill" id="status"><i></i><span id="statusText">连接中</span></span>
      <button class="btn ghost" id="btnAdd" type="button"><span aria-hidden="true">＋</span><span class="hide-sm">添加设备</span></button>
      <button class="btn ghost icon" id="btnSettings" type="button" aria-label="设置">⚙</button>
    </div>
  </header>

  <main>
    <!-- first run -->
    <section id="viewSetup" class="setup" hidden>
      <div class="hero">
        <img src="/icon.svg" alt="" width="64" height="64">
        <h1>随处复制，随处粘贴</h1>
        <p class="muted">手机、Mac、Windows 之间互传文字、截图和文件，换个网络也能用。<br>内容在本机加密后才上传，服务器只存密文，到期自动删除。</p>
      </div>
      <form id="formCreate" class="card">
        <label for="pw">服务器密码</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="部署时生成的 PASSWORD" required>
        <button class="btn primary block" type="submit">创建我的空间</button>
        <p class="error" id="setupError" hidden></p>
      </form>
      <p class="muted small center">已经在别的设备上创建过？在那台设备上点 <b>＋ 添加设备</b>，扫码或打开链接加入。</p>
    </section>

    <!-- main -->
    <section id="viewMain" hidden>
      <div class="card composer" id="composer">
        <textarea id="text" rows="2" placeholder="输入文字…"></textarea>
        <div class="composer-row">
          <button class="btn ghost" id="btnPaste" type="button" title="读取剪贴板并发送">📋 <span>粘贴</span></button>
          <label class="btn ghost" for="file" title="选择文件或照片">📎 <span>文件</span></label>
          <input id="file" type="file" multiple hidden>
          <span class="hint muted" id="hint"></span>
          <span class="spacer"></span>
          <button class="btn primary" id="btnSend" type="button">发送</button>
        </div>
      </div>

      <div id="transfers" class="transfers"></div>

      <div class="toolbar">
        <div class="chips" id="chips" role="tablist">
          <button class="chip active" data-filter="all" type="button">全部 <b id="cntAll">0</b></button>
          <button class="chip" data-filter="text" type="button">文字 <b id="cntText">0</b></button>
          <button class="chip" data-filter="image" type="button">图片 <b id="cntImage">0</b></button>
          <button class="chip" data-filter="file" type="button">文件 <b id="cntFile">0</b></button>
        </div>
        <div class="meter" id="meter" title="服务器存储用量（所有内容合计）">
          <span id="meterText">— / —</span>
          <div class="meter-bar"><div id="meterFill"></div></div>
        </div>
      </div>

      <div id="feed" class="feed" data-filter="all"></div>
      <div class="empty" id="empty">
        <div class="empty-icon">⇄</div>
        <p>还没有内容</p>
        <p class="muted small">在任何一台设备上粘贴或发送，其他设备会立刻收到。</p>
      </div>
      <p class="foot muted small" id="foot"></p>
    </section>
  </main>

  <div class="drop" id="drop" hidden><div>松开即可加密发送</div></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <dialog id="dlgAdd">
    <form method="dialog" class="dlg">
      <h2>添加设备</h2>
      <p class="muted small">用另一台设备扫码，或打开下面的链接。<b>这个链接就是钥匙</b>，拿到它就能看到空间里的全部内容，只发给自己的设备。</p>
      <canvas id="qr" width="264" height="264"></canvas>
      <input id="link" readonly>
      <div class="row">
        <button class="btn ghost" id="btnCopyLink" type="button">复制链接</button>
        <span class="spacer"></span>
        <button class="btn primary" value="close">完成</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgSettings">
    <form method="dialog" class="dlg">
      <h2>设置</h2>
      <label for="devName">本设备名称</label>
      <input id="devName" maxlength="40">
      <label class="check"><input type="checkbox" id="autoCopy"> 收到其他设备的文字时自动复制 <span class="muted small">（页面需在前台）</span></label>
      <hr>
      <div class="row">
        <button class="btn ghost" id="btnClear" type="button">清空全部内容</button>
        <button class="btn ghost danger" id="btnLeave" type="button">本设备退出</button>
        <button class="btn ghost danger" id="btnDestroy" type="button">删除整个空间</button>
      </div>
      <p class="muted small">退出只清除本设备上的密钥，其他设备不受影响。删除会立即清空服务器上的全部密文，所有设备都会失效。</p>
      <div class="row">
        <span class="spacer"></span>
        <button class="btn primary" value="close">完成</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgView" class="viewer">
    <form method="dialog"><button class="viewer-close" aria-label="关闭">✕</button></form>
    <img id="viewImg" alt="">
  </dialog>
</body>
</html>
